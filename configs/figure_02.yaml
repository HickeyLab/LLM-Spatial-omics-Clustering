      8da8f27977d946b8c912d42c8827b55c: 36464
      5318485b16983482401c3be24b6c42ad: 25362
      63d000170e475af142f6e8673de5eb0f: 23267
      768b7adb649959b6a4e354867595032d: 33112

  features:
    # 45 variables in H5AD X, plus these three H5AD obs columns, in this order.
    h5ad_obs_markers: [CD123, Hoechst1, CDX2]
    expected_total_markers: 48
    truth_column: cell_type_update
    coordinate_columns: [x, y]

  shared_umap:
    # The attached Methods text does not specify how the visual UMAP was made.
    # These settings reproduce the existing implementation in
    # cell_masks/umap_flowsom_simple.py and must remain labelled as
    # implementation-derived pending author confirmation.
    provenance: "VERIFY: implementation-derived settings; not specified in the attached Methods text"
    arcsinh_cofactor: 1.0
    standardize: true
    pca_variance_explained: 0.90
    harmony_batch_key: File_ID
    harmony_max_iterations: 30
    n_neighbors: 30
    min_dist: 0.3
    metric: euclidean
    random_seed: 42

  style:
    # Styling-only local input; labels still come from the H5AD.
    color_map_filename: cell_type_colors.csv
    zoom:
      # Recovered from the existing UMAP callout implementation.
      provenance: "VERIFY: implementation-derived callout bounds; not specified in the attached Methods text"
      x0: -2.6090098449614283
      y0: 9.438447911614285
      size: 2.98063852273
    point_size: 0.18
    point_alpha: 0.6

  clustering_methods:
    # Every benchmark method was configured to target K=300. The frozen
    # selected artifacts can have fewer occupied clusters; observed_clusters
    # records the exact artifact count validated by Panels D--J.
    leiden:
      assignment_filename: leiden_refined_best_full_clusters.csv
      assignment_column: cluster
      configured_clusters: 300
      observed_clusters: 55
      selected_artifact_parameters:
        features: "48 H5AD-derived cell-level features"
        standardize: true
        pca_components: 21
        n_neighbors: 15
        metric: euclidean
        leiden_resolution: 1.8
        # VERIFY: the attached final-run paragraph does not state whether
        # Harmony was applied. Existing source artifacts used it.
        harmony: "VERIFY: existing artifact used Harmony; confirm final-run use"

    flowsom:
      assignment_filename: flowsom_mdi_weighted_best_clusters.csv
      assignment_column: Cluster
      configured_clusters: 300
      observed_clusters: 300
      selected_artifact_parameters:
        features: "30 highest-variance features selected after arcsinh(x/1)"
        random_forest_trees: 200
        random_forest_class_weight: balanced
        random_forest_importance: mean_decrease_in_impurity
        standardize_weighted_features: true
        pca: false
        som_shape: [18, 18]
        metaclusters: 300
        random_seed: 42

    spatialsort:
      assignment_filename: spatialsort_full_clusters.csv
      assignment_column: spatialsort_cluster
      configured_clusters: 300
      observed_clusters: 60
      selected_artifact_parameters:
        features: "45 H5AD X variables"
        spatial_graph: "15-nearest-neighbor graph constructed within each region"
        use_priors: false
        use_anchor_cells: false
        initialization: "unseeded five-start Gaussian mixture model"
        mcmc_iterations: 15
        inner_double_metropolis_hastings_iterations: 5
        precision_scale: 0.5
        # The source Methods text explicitly says no fixed seed was documented.
        random_seed: null

    pixie:
      # This frozen methods_50 artifact has 50 occupied cell metaclusters and
      # is not a K300 result. It is produced by the exact streaming TIFF
      # command in docs/figure_02_panel_d.md and is intentionally gitignored.
      assignment_filename: data/processed/figure_02/pixie_tiff_methods_50/master_pixie_clusters.csv
      assignment_column: pixie_cell_cluster
      configured_clusters: 300
      observed_clusters: 50
      selected_artifact_parameters:
        input: "paired 48-channel OME-TIFF expression images and integer cell masks"
        include_hoechst: true
        gaussian_sigma_pixels: 2.0
        pixel_som_shape: [10, 10]
        pixel_som_learning_rate: 0.05
        pixel_som_initialization: data
        pixel_som_decay: linear
        pixel_som_passes: 1
        pixel_metaclusters: 20
        cell_som_shape: [20, 20]
        cell_som_sigma: 2.0
        cell_som_learning_rate: 0.3
        cell_som_iterations: 5000
        cell_som_initialization: minisom_default
        cell_som_decay: asymptotic
        cell_metaclusters: 50
        random_seed: 42

  outputs:
    coordinates_csv: outputs/figure_02/figure_02d_b004_umap_coordinates.csv
    panel_png: outputs/figure_02/figure_02d_b004_umap_comparison.png
    panel_pdf: outputs/figure_02/figure_02d_b004_umap_comparison.pdf
    provenance_json: outputs/figure_02/figure_02d_b004_provenance.json

