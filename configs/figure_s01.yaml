# Supplementary Figure 1 configuration.
#
# The user-supplied composite fixes the numbering and panel map as S1 A--E.
# Source data and generated outputs remain local and are not committed.
supplementary_figure: 1
working_title: "VERIFY: Reference-label phenotypes and clustering diagnostics"

figure_02_dependency:
  config_path: configs/figure_02.yaml
  expected_source_cells: 220082
  expected_non_noise_cells: 209587
  truth_column: cell_type_update
  excluded_label: Noise
  expected_raw_label_count_including_noise: 28
  expected_raw_label_count_excluding_noise: 27
  expected_methods:
    leiden: 55
    flowsom: 300
    spatialsort: 60
    pixie: 50
  method_order:
    - [leiden, Leiden]
    - [flowsom, FlowSOM]
    - [spatialsort, SpatialSort]
    - [pixie, PIXIE]

shared:
  color_map_path: configs/cell_type_colors.csv
  font_family: Arial
  random_seed: 42
  panel_label_fontsize: 24

