panel_d:
  title: "FlowSOM purity by requested cluster count"
  source_filename: flowsom_k_sweep_purity.csv
  source_sha256: "723dfd9508fc1a9bcb700ba77cf37f04de18016667e3768807f600549add0338"
  # Recovered historical exploratory sweep. It predates the final
  # RF-MDI-weighted/no-PCA Figure 2 FlowSOM configuration.
  provenance_status: "VERIFY: recovered exploratory FlowSOM sweep; exact generator and final-method-equivalent sweep are not available"
  expected_rows:
    - [10, 10, 0.37564634999681934]
    - [50, 50, 0.4309302896193237]
    - [100, 100, 0.4582655555656528]
    - [150, 150, 0.4760362046873438]
    - [200, 200, 0.4848829072800138]
    - [250, 250, 0.4883770594596559]
    - [300, 300, 0.49248916313010604]
    - [350, 324, 0.4931889023182268]
  style:
    figure_size_inches: [4.4, 3.3]
    line_color: "#2784c2"
    marker_size: 4.0
    y_label: "Purity (%)"
    x_label: "Number of Clusters"
  outputs:
    sweep_csv: outputs/supplementary/figure_s01/figure_s01d_flowsom_cluster_sweep.csv
    panel_png: outputs/supplementary/figure_s01/figure_s01d_flowsom_cluster_sweep.png
