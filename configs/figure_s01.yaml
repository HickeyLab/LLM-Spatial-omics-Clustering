    provenance_json: outputs/supplementary/figure_s01/figure_s01d_provenance.json

panel_e:
  title: "Clustering metric distributions"
  # Raw non-Noise labels are used without the 20-class Figure 2 evaluation
  # harmonization. F1/Recall use global, retrospective cluster-majority labels.
  majority_tie_break: "largest count, then lexicographically smallest label"
  metrics:
    - key: adjusted_rand_index
      label: "Adjusted Rand Index"
      grain: region
    - key: adjusted_mutual_information
      label: "Adjusted Mutual Information"
      grain: region
    - key: shannon_index
      label: "Shannon Index"
      grain: cluster
    - key: f1_score
      label: "F1 Score"
      grain: cell_type
    - key: recall
      label: "Recall"
      grain: cell_type
    - key: purity_percent
      label: "Purity (%)"
      grain: cluster
  style:
    figure_size_inches: [20.0, 3.4]
    jitter_width: 0.13
    point_size: 12.0
    box_width: 0.62
  outputs:
    metrics_csv: outputs/supplementary/figure_s01/figure_s01e_clustering_metrics.csv
    panel_png: outputs/supplementary/figure_s01/figure_s01e_clustering_metrics.png
    panel_pdf: outputs/supplementary/figure_s01/figure_s01e_clustering_metrics.pdf
    provenance_json: outputs/supplementary/figure_s01/figure_s01e_provenance.json
