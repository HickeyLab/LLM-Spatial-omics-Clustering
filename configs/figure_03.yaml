# Figure 3 configuration. LLM credentials are intentionally never stored here.
figure: 3
title: "Benchmarking LLM-assisted cell-type annotation"

# Figure 3 does not define or rerun clustering. It consumes the exact selected
# assignments validated by Figure 2 Panel D, including the image-native
# 50-cluster TIFF PIXIE artifact.
figure_02_dependency:
  config_path: configs/figure_02.yaml
  source_panel: panel_d
  expected_methods:
    flowsom:
      label: FlowSOM
      expected_clusters: 300
    leiden:
      label: Leiden
      expected_clusters: 55
    spatialsort:
      label: SpatialSort
      expected_clusters: 60
    pixie:
      label: PIXIE
      expected_clusters: 50
  method_display_order: [flowsom, leiden, spatialsort, pixie]
  grouped_bar_method_order: [leiden, flowsom, spatialsort, pixie]

evaluation:
  truth_column: cell_type_update
  excluded_labels: [Noise]
  expected_source_cells: 220082
  expected_evaluation_cells: 209587
  expected_classes: 20
  allowed_labels:
    - B
    - CD4+ T cell
    - CD7+ Immune
    - CD8+ T
    - CD66+ Enterocyte
    - Cycling TA
    - DC
    - Endothelial
    - Enterocyte
    - Goblet
    - ICC
    - Lymphatic
    - M2 Macrophage
    - MUC1+ Enterocyte
    - Nerve
    - Neuroendocrine
    - Neutrophil
    - Plasma
    - Smooth muscle
    - Stroma
  # This is deliberately identical to Figure 2's 20-class evaluation map.
  # Historical Figure 3 scripts disagreed about Paneth; the notebook refuses
  # that split-brain behavior and inherits Figure 2's Paneth -> Goblet choice.
  harmonization_source: "configs/figure_02.yaml:panel_e.evaluation.harmonization_map"

marker_summaries:
  marker_source: "45 H5AD X protein-marker columns from all 220,082 Figure 2 B004 cells"
  truth_independence: "reference labels and Noise filtering are evaluation-only"
  ranking: "descending within-cluster mean expression"
  comparison_operators:
    expression: ">"
    fraction: ">"
    mean_expression: ">"
  default:
    # Recovered from find_top_markers_per_cluster.py.
    provenance: "legacy pre-optimization implementation"
    expression_threshold: 0.30
    fraction_threshold: 0.60
    mean_expression_threshold: 0.30
    maximum_markers: 5
    fallback_minimum_markers: 3
  optimized:
    # Final settings from the attached Methods text / Supplementary Table 2.
    flowsom:
      expression_threshold: 0.31
      fraction_threshold: 0.29
      mean_expression_threshold: 0.14
      maximum_markers: 3
      fallback_minimum_markers: 2
    leiden:
      expression_threshold: 0.30
      fraction_threshold: 0.58
      mean_expression_threshold: 0.02
      maximum_markers: 4
      fallback_minimum_markers: 2
    spatialsort:
      expression_threshold: 0.39
      fraction_threshold: 0.41
      mean_expression_threshold: 0.02
      maximum_markers: 6
      fallback_minimum_markers: 3
    pixie:
      expression_threshold: 0.10
      fraction_threshold: 0.56
      mean_expression_threshold: 0.02
      maximum_markers: 4
      fallback_minimum_markers: 4

prompt:
  template_path: prompts/figure_03_cluster_annotation_v1.txt
  temperature: 1.0
  max_output_tokens: 16000
  request_timeout_seconds: 240
  cache_directory: outputs/figure_03/cache

# Display names match the attached Methods text. Requested API identifiers and
# provider-reported served versions are both retained in cache provenance.
providers:
  gemini:
    label: Gemini
    api_key_name: GEMINI_API_KEY
    generation_status: available
    endpoint_template: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
    conditions:
      non_reasoning:
        display_name: "Gemini 3 Flash"
        model_id: gemini-3-flash-preview
        # Provider documentation says "minimal" can still think on hard tasks.
        historical_condition_label: non_reasoning
        no_reasoning_guaranteed: false
        thinking_level: minimal
      reasoning:
        display_name: "Gemini 3.1 Pro"
        model_id: gemini-3.1-pro-preview
        thinking_level: high

  openai:
    label: GPT
    api_key_name: OPENAI_API_KEY
    generation_status: available
    endpoint: "https://api.openai.com/v1/responses"
    conditions:
      non_reasoning:
        display_name: "GPT-5.2 Instant"
        model_id: gpt-5.2-2025-12-11
        reasoning_effort: none
      reasoning:
        display_name: "GPT-5.2 Thinking"
        model_id: gpt-5.2-2025-12-11
        reasoning_effort: high

  anthropic:
    label: Claude
    api_key_name: ANTHROPIC_API_KEY
    generation_status: available
    endpoint: "https://api.anthropic.com/v1/messages"
    anthropic_version: "2023-06-01"
    conditions:
      non_reasoning:
        display_name: "Sonnet 4.6 Standard"
        model_id: claude-sonnet-4-6
        thinking_mode: disabled
        effort: low
      reasoning:
        display_name: "Sonnet 4.6 Thinking"
        model_id: claude-sonnet-4-6
        thinking_mode: adaptive
        effort: high

  deepseek:
    label: DeepSeek
    api_key_name: DEEPSEEK_API_KEY
    endpoint: "https://api.deepseek.com/chat/completions"
    # These aliases reproduced V3.2 in February 2026 and were retired on
    # 2026-07-24. Fresh calls are blocked. Exact historical caches may still be
    # used; migration to V4 requires explicit author approval and a new analysis.
    generation_status: retired
    retired_on: "2026-07-24"
    migration_requires_author_approval: true
    conditions:
      non_reasoning:
        display_name: "DeepSeek-V3.2"
        model_id: deepseek-chat
        temperature_supported: true
      reasoning:
        display_name: "DeepSeek-V3.2 Thinking"
        model_id: deepseek-reasoner
        # DeepSeek documented temperature as unsupported in reasoning mode.
        temperature_supported: false

provider_display_order: [gemini, openai, anthropic, deepseek]

consensus:
  # These priorities reproduce the attached Methods text. They were selected
  # retrospectively after testing all 24 model orders and are not prespecified.
  status: exploratory_historical_reproduction
  tie_break_selected_on_evaluation_labels: true
  emit_all_24_order_sensitivity: true
  tie_priority:
    flowsom: [gemini, openai, anthropic, deepseek]
    leiden: [anthropic, gemini, openai, deepseek]
    spatialsort: [gemini, openai, anthropic, deepseek]
    pixie: [openai, gemini, anthropic, deepseek]

style:
  cell_type_color_map_path: configs/figure_03_cell_type_colors.csv
  before_color: "#AFC6E9"
  after_color: "#F2B184"
  non_reasoning_color: "#AFC6E9"
  reasoning_color: "#F2B184"
  box_edge_color: "#111827"
  count_bar_color: "#64748B"
  heatmap_cmap: RdYlGn
  region_colors:
    2e65eeef2dd18bee2a0baf1cec6d35a1: "#003F5C"
    5318485b16983482401c3be24b6c42ad: "#2F4B7C"
    63d000170e475af142f6e8673de5eb0f: "#665191"
    768b7adb649959b6a4e354867595032d: "#A05195"
    76d3efd17b6fc83aaac13e961824c5ae: "#D45087"
    8da8f27977d946b8c912d42c8827b55c: "#F95D6A"
    ae422532f260b3d6fc662aae69b05d33: "#FF7C43"
    dceadbb36871071f30c308ca091fbdc8: "#FFA600"
  provider_colors:
    gemini: "#4C78A8"
    openai: "#F58518"
    anthropic: "#54A24B"
    deepseek: "#B279A2"
    consensus: "#9C755F"

panels:
  panel_a:
    title: "Marker-summary, LLM annotation, and evaluation workflow"
    output_stem: figure_03a_llm_annotation_workflow

  panel_b:
    title: "Protein Marker Optimization"
    annotation_provider: openai
    annotation_condition: non_reasoning
    states: [default, optimized]
    y_axis_label: "Upper Bound Purity (%)"
    output_stem: figure_03b_marker_optimization

  panel_c:
    title: "Representative stromal-cell spatial distribution"
    annotation_provider: openai
    annotation_condition: non_reasoning
    method: leiden
    target_cell_type: Stroma
    region:
      # Fixed legacy callout; the cell assignments now come from Figure 2.
      file_id: 2e65eeef2dd18bee2a0baf1cec6d35a1
      x_min: 2145.0
      x_max: 7276.0
      y_min: 3127.0
      y_max: 8357.0
    expected_region_cells: 8997
    expected_target_cells: 1136
    expected_noise_background_cells: 310
    target_color: "#2F6FB3"
    other_color: "#D9D9D9"
    output_stem: figure_03c_stroma_before_after_optimization

  panel_d:
    title: "Cell-Level Upper Bound Purity: Reasoning vs. Non-Reasoning"
    metric_level: cell
    states: [non_reasoning, reasoning]
    condition_caveat: "* Gemini minimal thinking is the historical non-reasoning condition; it may still reason."
    output_stem: figure_03d_cell_level_reasoning_comparison

  panel_e:
    title: "Cluster-Level Upper Bound Purity: Reasoning vs. Non-Reasoning"
    metric_level: cluster
    states: [non_reasoning, reasoning]
    condition_caveat: "* Gemini minimal thinking is the historical non-reasoning condition; it may still reason."
    output_stem: figure_03e_cluster_level_reasoning_comparison

  panel_f:
    title: "Cell-Level Upper Bound Purity"
    metric_level: cell
    condition: reasoning
    output_stem: figure_03f_cell_level_llm_heatmap

  panel_g:
    title: "Cluster-Level Upper Bound Purity"
    metric_level: cluster
    condition: reasoning
    output_stem: figure_03g_cluster_level_llm_heatmap

  panel_h:
    title: "Annotation Purity for Leiden Clusters"
    method: leiden
    condition: reasoning
    metric: absolute_cell_type_accuracy
    output_stem: figure_03h_leiden_absolute_cell_type_accuracy

  panel_i:
    title: "Upper-Bound Annotation Purity for Leiden Clusters"
    method: leiden
    condition: reasoning
    metric: cell_type_pct_of_upper_bound
    output_stem: figure_03i_leiden_cell_type_pct_upper_bound

  panel_j:
    title: "Cell-Level Purity Upper Bound"
    metric_level: cell
    condition: reasoning
    include_consensus: true
    output_stem: figure_03j_cell_level_reasoning_consensus

  panel_k:
    title: "Cluster-Level Purity Upper Bound"
    metric_level: cluster
    condition: reasoning
    include_consensus: true
    output_stem: figure_03k_cluster_level_reasoning_consensus

  panel_l:
    title: "Spatial Agreement Across Annotation Methods"
    method: leiden
    condition: reasoning
    include_consensus: true
    target_cells: 1000
    cell_tolerance: 100
    random_seed: 123
    candidate_centers_per_file: 160
    radius_scale_factors: [0.90, 0.95, 1.00, 1.05, 1.10]
    output_stem: figure_03l_spatial_annotation_agreement
