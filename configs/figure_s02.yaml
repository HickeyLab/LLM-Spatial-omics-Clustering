# Supplementary Figure 2 configuration.
#
# Both panels are derived views of the single Figure 4 Leiden--GPT analysis.
# They must never select or read a separate annotation mapping.
supplementary_figure: 2
working_title: "VERIFY: Leiden-GPT count confusion and per-cluster accuracy"

figure_04_dependency:
  config_path: configs/figure_04.yaml
  expected_provider: openai
  expected_condition: reasoning
  expected_method: leiden
  expected_marker_state: optimized
  expected_source_cells: 220082
  expected_noise_cells: 10495
  expected_truth_classes: 21
  expected_leiden_clusters: 55
  expected_regions: 8

credential_policy:
  provider: openai
  environment_variable: OPENAI_API_KEY
  notebook_placeholder: PASTE_OPENAI_API_KEY_HERE
  # Figure 4's credential guard runs before H5AD/cache reads and output writes.
  placeholder_must_fail_closed: true

reference_composite:
  # These files live in the parent cell_masks workspace and explain the
  # screenshot, but they are not repository dependencies or analysis inputs.
  panel_a_legacy_mapping: ../data/cluster_celltype_leiden.json
  panel_a_legacy_mapping_sha256: "9dfc595014e4df64e774516f54b0e636bae8d0c0e0a7286099327aa5580e0ef8"
  panel_b_legacy_mapping: ../data/cluster_celltype_gpt52_leiden.json
  panel_b_legacy_mapping_sha256: "8e6827427bccd8755953f04c7767cd0e05adcc451381a5b5559eaa7d00871f02"
  provenance_status: "VERIFY: the supplied legacy panels used different annotation maps, and the Panel B gpt52 file was produced by a deterministic no-API expert system; this notebook intentionally replaces both with Figure 4's one provenance-locked mapping"

shared_style:
  font_family: Arial
  panel_label_fontsize: 28
  confusion_cmap: RdYlGn
  correct_color: "#3D6D5C"
  annotation_loss_color: "#CD8940"
  clustering_loss_color: "#D9D9D9"

panel_a:
  title: "Cell Counts Confusion Matrix"
  source_table: figure_04.confusion_counts
  matrix_semantics:
    rows: ground-truth harmonized cell type
    columns: Figure 4 GPT-assigned Leiden-cluster label
    values: cell count
    normalization: none
  style:
    figure_size_inches: [7.2, 6.5]
    axis_label_fontsize: 10
    tick_label_fontsize: 8
    colorbar_label: Cell Count
  outputs:
    matrix_csv: outputs/supplementary/figure_s02/figure_s02a_cell_count_confusion_matrix.csv
    panel_png: outputs/supplementary/figure_s02/figure_s02a_cell_count_confusion_matrix.png
    panel_pdf: outputs/supplementary/figure_s02/figure_s02a_cell_count_confusion_matrix.pdf
    provenance_json: outputs/supplementary/figure_s02/figure_s02a_provenance.json

panel_b:
  title: "Accuracy Per Cluster"
  source_table: figure_04.cluster_stats
  # Match the supplied panel's visual order: highest-purity clusters first,
  # with deterministic secondary ordering.
  sort:
    columns: [purity, final_correct, n_cells, cluster]
    ascending: [false, false, false, true]
  row_label_template: "Cluster {cluster} - {majority_truth}"
  row_label_semantics: "The suffix is the cluster's majority reference label, not the GPT prediction."
  decomposition:
    final_correct: "fraction(truth == GPT-assigned cluster label)"
    annotation_loss: "max(cluster purity - final_correct, 0)"
    clustering_loss: "1 - cluster purity"
    caveat: "Arithmetic upper-bound components; not mutually exclusive causal cell assignments."
  style:
    figure_size_inches: [7.4, 13.0]
    bar_height: 0.78
    tick_label_fontsize: 7
    x_axis_label: "Fraction of Cells in Each Cluster"
    y_axis_label: "Leiden Cluster and Majority Ground-Truth Label"
  outputs:
    cluster_stats_csv: outputs/supplementary/figure_s02/figure_s02b_leiden_cluster_accuracy.csv
    panel_png: outputs/supplementary/figure_s02/figure_s02b_leiden_cluster_accuracy.png
    panel_pdf: outputs/supplementary/figure_s02/figure_s02b_leiden_cluster_accuracy.pdf
    provenance_json: outputs/supplementary/figure_s02/figure_s02b_provenance.json
